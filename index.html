<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potential Board 13</title>
<style>
  :root {
    --red: #e01414;
    --red-bright: #ff3b3b;
    --red-deep: #7a0505;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: radial-gradient(ellipse at 50% 35%, #1a0303 0%, #060000 55%, #000 100%);
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* particle canvas sits above the glow, below the text */
  #particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Soft ambient red wash — the logo carries its own lens flare */
  .glow {
    position: absolute;
    top: 34%;
    left: 50%;
    width: 1400px;
    height: 900px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(ellipse 45% 55% at 50% 50%, rgba(224,20,20,0.30) 0%, rgba(150,10,10,0.18) 35%, rgba(90,0,0,0.10) 60%, transparent 78%);
    filter: blur(6px);
    pointer-events: none;
    z-index: 0;
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.05); }
  }

  .stage {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 1600px;
  }

  /* ---- Real logo artwork ---- */
  .logo {
    display: block;
    width: min(92vw, 1100px);
    height: auto;
    margin: 0 auto 0.4em;
    /* lift it off the black + echo the red glow */
    filter: drop-shadow(0 0 40px rgba(224,20,20,0.45));
  }

  .coming {
    font-size: clamp(1.6rem, 4.5vw, 3.2rem);
    font-weight: 300;
    letter-spacing: 0.02em;
    margin-bottom: 0.2em;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(1.2rem, 5vw, 4.5rem);
    flex-wrap: wrap;
  }
  .unit { min-width: 3.5ch; }
  .num {
    font-size: clamp(2.8rem, 8vw, 6rem);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: clamp(0.85rem, 2vw, 1.4rem);
    font-weight: 300;
    color: #cfcfcf;
    margin-top: 0.3em;
  }
</style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="glow"></div>
  <div class="stage">
    <img class="logo" src="logo.png" alt="S.V.N.B. Hooke — Potential Board 13 — Hope never leaves">
    <div class="coming" id="coming">Coming in</div>
    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">seconds</div></div>
    </div>
  </div>

  <script>
    /* ---------- Countdown ---------- */
    (function () {
      const now = new Date();
      let target = new Date(now.getFullYear(), 8, 3, 17, 0, 0); // Sep 3, 17:00 local
      if (target < now) target = new Date(now.getFullYear() + 1, 8, 3, 17, 0, 0);
      const pad = n => String(n).padStart(2, '0');
      const el = {
        days: document.getElementById('days'), hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'), seconds: document.getElementById('seconds'),
        coming: document.getElementById('coming'), countdown: document.getElementById('countdown'),
      };
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
          el.coming.textContent = "It's here.";
          el.countdown.style.display = 'none';
          clearInterval(timer); return;
        }
        const s = Math.floor(diff / 1000);
        el.days.textContent = pad(Math.floor(s / 86400));
        el.hours.textContent = pad(Math.floor((s % 86400) / 3600));
        el.minutes.textContent = pad(Math.floor((s % 3600) / 60));
        el.seconds.textContent = pad(s % 60);
      }
      tick();
      const timer = setInterval(tick, 1000);
    })();

    /* ---------- Floating ember / dust particles ---------- */
    (function () {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];
      const COUNT = 90;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function make() {
        const size = Math.random() * 2.6 + 0.6;
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: size,
          vy: -(Math.random() * 0.5 + 0.15),      // drift upward
          vx: (Math.random() - 0.5) * 0.3,
          life: Math.random(),
          twk: Math.random() * 0.04 + 0.01,       // twinkle speed
          hue: Math.random() < 0.25 ? 45 : 0,     // mostly red, some amber embers
        };
      }
      for (let i = 0; i < COUNT; i++) particles.push(make());

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life += p.twk;
          const alpha = 0.25 + 0.55 * Math.abs(Math.sin(p.life));
          // reset when off-screen
          if (p.y < -10 || p.x < -10 || p.x > w + 10) {
            p.x = Math.random() * w; p.y = h + 10;
          }
          const light = p.hue === 45 ? '255,190,90' : '255,70,70';
          ctx.beginPath();
          ctx.fillStyle = 'rgba(' + light + ',' + alpha + ')';
          ctx.shadowColor = 'rgba(' + light + ',0.9)';
          ctx.shadowBlur = p.r * 4;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
