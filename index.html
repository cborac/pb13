<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potential Board 13</title>
<style>
  :root {
    --red: #e01414;
    --red-bright: #ff3b3b;
    --red-deep: #7a0505;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: radial-gradient(ellipse at 50% 35%, #1a0303 0%, #060000 55%, #000 100%);
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* particle canvas sits above the glow, below the text */
  #particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Red lens-flare glow behind the title */
  .glow {
    position: absolute;
    top: 30%;
    left: 50%;
    width: 1300px;
    height: 750px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(ellipse 40% 55% at 50% 50%, rgba(255,255,255,0.9) 0%, rgba(255,60,60,0.55) 12%, rgba(200,10,10,0.35) 30%, rgba(120,0,0,0.15) 55%, transparent 75%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
    animation: pulse 5s ease-in-out infinite;
  }
  .glow::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150%;
    height: 3px;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, rgba(255,120,120,0.7) 40%, rgba(255,255,255,0.95) 50%, rgba(255,120,120,0.7) 60%, transparent);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.06); }
  }

  .stage {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 1600px;
  }

  .subtitle {
    display: inline-block;
    background: rgba(120,0,0,0.35);
    padding: 0.35em 1.1em;
    letter-spacing: 0.35em;
    font-size: clamp(0.9rem, 2.2vw, 1.7rem);
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255,60,60,0.9);
    margin-bottom: 0.2em;
  }

  /* ---- Cinematic metallic-chrome 3D title (Avengers-style) ---- */
  .title {
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(3rem, 13vw, 11rem);
    line-height: 0.95;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0.12em 0;
    /* metallic red-chrome fill: bright specular top, deep body, re-lit bottom */
    background: linear-gradient(180deg,
      #ffe3e3 0%,
      #ff6b6b 18%,
      #e01414 40%,
      #8f0000 52%,
      #5c0000 60%,
      #d11616 74%,
      #ff8a8a 88%,
      #6e0000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    /* deep 3D extrusion + outer red glow, stacked shadows */
    filter:
      drop-shadow(0 1px 0 #4a0000)
      drop-shadow(0 2px 0 #3a0000)
      drop-shadow(0 3px 0 #2a0000)
      drop-shadow(0 4px 1px #1a0000)
      drop-shadow(0 6px 3px rgba(0,0,0,0.9))
      drop-shadow(0 0 30px rgba(224,20,20,0.65))
      drop-shadow(0 0 60px rgba(224,20,20,0.35));
  }
  /* bright chrome bevel highlight layered over the fill */
  .title::after {
    content: attr(data-text);
    position: absolute;
    left: 0; right: 0; top: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.35) 12%,
      transparent 30%,
      transparent 62%,
      rgba(255,190,190,0.4) 78%,
      transparent 92%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .tagline {
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(1.3rem, 4vw, 3rem);
    color: var(--red);
    text-shadow: 0 0 14px rgba(224,20,20,0.7), 0 2px 3px #000;
    margin-bottom: 0.6em;
  }

  .coming {
    font-size: clamp(1.6rem, 4.5vw, 3.2rem);
    font-weight: 300;
    letter-spacing: 0.02em;
    margin-bottom: 0.2em;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(1.2rem, 5vw, 4.5rem);
    flex-wrap: wrap;
  }
  .unit { min-width: 3.5ch; }
  .num {
    font-size: clamp(2.8rem, 8vw, 6rem);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: clamp(0.85rem, 2vw, 1.4rem);
    font-weight: 300;
    color: #cfcfcf;
    margin-top: 0.3em;
  }
</style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="glow"></div>
  <div class="stage">
    <div class="subtitle">S.V.N.B. HOOKE</div>
    <h1 class="title" data-text="Potential Board 13">Potential Board 13</h1>
    <div class="tagline">Hope never leaves</div>
    <div class="coming" id="coming">Coming in</div>
    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">seconds</div></div>
    </div>
  </div>

  <script>
    /* ---------- Countdown ---------- */
    (function () {
      const now = new Date();
      let target = new Date(now.getFullYear(), 8, 3, 17, 0, 0); // Sep 3, 17:00 local
      if (target < now) target = new Date(now.getFullYear() + 1, 8, 3, 17, 0, 0);
      const pad = n => String(n).padStart(2, '0');
      const el = {
        days: document.getElementById('days'), hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'), seconds: document.getElementById('seconds'),
        coming: document.getElementById('coming'), countdown: document.getElementById('countdown'),
      };
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
          el.coming.textContent = "It's here.";
          el.countdown.style.display = 'none';
          clearInterval(timer); return;
        }
        const s = Math.floor(diff / 1000);
        el.days.textContent = pad(Math.floor(s / 86400));
        el.hours.textContent = pad(Math.floor((s % 86400) / 3600));
        el.minutes.textContent = pad(Math.floor((s % 3600) / 60));
        el.seconds.textContent = pad(s % 60);
      }
      tick();
      const timer = setInterval(tick, 1000);
    })();

    /* ---------- Floating ember / dust particles ---------- */
    (function () {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];
      const COUNT = 90;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function make() {
        const size = Math.random() * 2.6 + 0.6;
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: size,
          vy: -(Math.random() * 0.5 + 0.15),      // drift upward
          vx: (Math.random() - 0.5) * 0.3,
          life: Math.random(),
          twk: Math.random() * 0.04 + 0.01,       // twinkle speed
          hue: Math.random() < 0.25 ? 45 : 0,     // mostly red, some amber embers
        };
      }
      for (let i = 0; i < COUNT; i++) particles.push(make());

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life += p.twk;
          const alpha = 0.25 + 0.55 * Math.abs(Math.sin(p.life));
          // reset when off-screen
          if (p.y < -10 || p.x < -10 || p.x > w + 10) {
            p.x = Math.random() * w; p.y = h + 10;
          }
          const light = p.hue === 45 ? '255,190,90' : '255,70,70';
          ctx.beginPath();
          ctx.fillStyle = 'rgba(' + light + ',' + alpha + ')';
          ctx.shadowColor = 'rgba(' + light + ',0.9)';
          ctx.shadowBlur = p.r * 4;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
